<title>Scale Sketch</title>
<style>
/* Layout: one-screen drafting desk — tool rail on the left, paper in the middle, a context strip at the bottom. */
:root{
  --desk:#cfd6dc; --desk-line:#b9c2ca;
  --bar:#f7f8f9; --bar-fg:#1d2429; --bar-muted:#6a7681; --bar-border:#d7dde2;
  --accent:#d3611b; --accent-fg:#ffffff; --accent-soft:#fbe9dd;
  --paper:#ffffff; --paper-shadow:rgba(20,30,40,.28);
  --frame:#2b6cb0; --frame-soft:rgba(43,108,176,.10); --grid:rgba(43,108,176,.16); --grid-major:rgba(43,108,176,.32);
  --snap:#0aa35d; --sel:#d3611b; --danger:#c0392b;
  --font:"Sarabun",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2a3138; --desk-line:#3a434c;
  --bar:#1b2126; --bar-fg:#e8edf1; --bar-muted:#93a0ab; --bar-border:#323b44;
  --accent:#e8843f; --accent-fg:#1b1410; --accent-soft:#3a2818;
  --paper:#f4f2ee; --paper-shadow:rgba(0,0,0,.55);
  --frame:#4d8fd8; --frame-soft:rgba(77,143,216,.12); --grid:rgba(43,108,176,.18); --grid-major:rgba(43,108,176,.36);
  --snap:#22c57a; --sel:#e8843f; --danger:#e5645a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#2a3138; --desk-line:#3a434c;
  --bar:#1b2126; --bar-fg:#e8edf1; --bar-muted:#93a0ab; --bar-border:#323b44;
  --accent:#e8843f; --accent-fg:#1b1410; --accent-soft:#3a2818;
  --paper:#f4f2ee; --paper-shadow:rgba(0,0,0,.55);
  --frame:#4d8fd8; --frame-soft:rgba(77,143,216,.12); --grid:rgba(43,108,176,.18); --grid-major:rgba(43,108,176,.36);
  --snap:#22c57a; --sel:#e8843f; --danger:#e5645a;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--desk);color:var(--bar-fg);font-family:var(--font);font-size:14px;touch-action:none;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
#app{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto 1fr;grid-template-areas:"top top" "rail stage"}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));background:var(--bar);border-bottom:1px solid var(--bar-border);flex-wrap:wrap;min-width:0}
#bStroke{height:auto;min-height:54px;padding-block:3px}
#rail{grid-area:rail;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:3px;padding:6px 5px;background:var(--bar);border-right:1px solid var(--bar-border);overflow-y:auto;overflow-x:hidden;align-content:start}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 10px;border:1px solid var(--bar-border);border-radius:8px;background:transparent;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn:focus-visible,.tool:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{width:36px;padding:0}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:54px;padding:0 2px;height:54px;flex-shrink:0;white-space:nowrap;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;font-size:11px;color:var(--bar-muted)}
.tool svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--accent-soft);color:var(--bar-fg)}
.tool.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tool .sub{font-size:9px;line-height:1;opacity:.85;margin-top:-1px}
.tool.temp{outline:2px dashed var(--sel);outline-offset:-3px}
.tool.has-menu::after{content:'';position:absolute;right:4px;top:4px;border:3px solid transparent;border-top-color:currentColor;opacity:.7}
#name{flex:1 1 140px;min-width:100px;height:34px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 8px;font-weight:600;font-size:15px}
#name:hover,#name:focus{border-color:var(--bar-border);background:var(--desk)}
select.sel,input.num{height:34px;border:1px solid var(--bar-border);border-radius:8px;background:var(--bar);padding:0 8px}
input.num{width:96px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.lbl{font-size:12px;color:var(--bar-muted)}
.grp{display:inline-flex;align-items:center;gap:6px}
#props{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;background:var(--bar);border:1px solid var(--bar-border);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.15);pointer-events:auto;max-width:720px;margin:0 auto}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:var(--bar);border:1px solid var(--bar-border);color:var(--bar-muted);font-size:12px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#zoomtag{position:absolute;right:12px;top:10px;padding:4px 10px;border-radius:999px;background:var(--bar);border:1px solid var(--bar-border);font-size:12px;color:var(--bar-muted);font-variant-numeric:tabular-nums;cursor:pointer}
.pop{position:absolute;z-index:20;background:var(--bar);border:1px solid var(--bar-border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:200px}
.pop .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bar-border);cursor:pointer;padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wbtn{height:34px;padding:0 10px;border:1px solid var(--bar-border);border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;gap:8px}
.wbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.wbtn i{display:block;width:34px;background:currentColor;border-radius:2px}
#overlay{position:absolute;inset:0;z-index:30;background:rgba(15,20,25,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--bar);border-radius:16px;border:1px solid var(--bar-border);padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px;text-wrap:balance}
.doclist{display:flex;flex-direction:column;gap:6px}
.docrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bar-border);border-radius:10px;cursor:pointer}
.docrow:hover{background:var(--accent-soft)}
.docrow .t{flex:1;min-width:0}
.docrow .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docrow .t span{font-size:12px;color:var(--bar-muted)}
.toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar-fg);color:var(--bar);padding:8px 14px;border-radius:999px;font-size:13px;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.menu{position:absolute;z-index:25;top:calc(48px + env(safe-area-inset-top,0px));left:10px}
.menu .btn{justify-content:flex-start;width:100%;border:0}
@media (max-width:640px){
  #app{grid-template-rows:auto 1fr auto;grid-template-columns:1fr;grid-template-areas:"top" "stage" "rail"}
  #rail{grid-template-columns:none;grid-template-rows:auto auto;grid-auto-flow:column;grid-auto-columns:max-content;border-right:0;border-top:1px solid var(--bar-border);overflow-x:auto;overflow-y:hidden;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  #props{bottom:12px}
  #hint{display:none}
}
@media (max-height:720px) and (min-width:641px){.tool{height:46px;font-size:10px;gap:0}.tool svg{width:18px;height:18px}#bStroke{min-height:46px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

// ---------- storage (IndexedDB) ----------

async function dbAll(){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('docs').objectStore('docs').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}catch(e){return [];}}
async function dbDel(id){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('docs','readwrite');t.objectStore('docs').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}

function scalePicker(cur,apply){

  const s=w.querySelector('select'),c=w.querySelector('input');

  for(const v of opts)s.append(new Option(fmtScale(v),v));s.append(new Option('กำหนดเอง…','custom'));s.value=String(cur);
  s.addEventListener('change',()=>{if(s.value==='custom'){c.hidden=false;c.value='';c.focus();}else{c.hidden=true;apply(parseFloat(s.value));}});

// ---------- file saving ----------
async function saveFile(name,data){
  if(dl){try{await dl.save({filename:name,data});toast('บันทึกไฟล์แล้ว');}catch(e){if(e&&e.code!=='declined')toast('บันทึกไฟล์ไม่สำเร็จ');}return;}
  const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith('.pdf')?'application/pdf':'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}
function safeName(){return (doc.name||'sketch').replace(/[\\/:*?"<>|]+/g,'-');}
